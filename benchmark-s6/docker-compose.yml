services:
  redis:
    image: redis:8-alpine
    command: redis-server --save ""
    ports: ["6379:6379"]
  placement:
    image: daprio/placement:1.16.0
    command: ./placement --port 50006
  building-service:
    build: building-service
    ports: ["8005:8005"]
    volumes:
      - ./metrics/building-service:/metrics
  # --- buildingSchedule ---
  buildingSchedule-sidecar:
    image: daprio/daprd:1.16.0
    command: ["./daprd", "--app-id=buildingSchedule", "--app-port=3000",
              "--app-channel-address=buildingSchedule",
              "--resources-path=/components", "--placement-host-address=placement:50006"]
    volumes: ["./dapr-components:/components"]
    depends_on: [redis, placement]
  buildingSchedule:
    image: alexzangerle/smartbuilding-dapr:latest
    pull_policy: always
    environment:
      ROLE: buildingSchedule
      ACTOR_ID: buildingSchedule-0
      BUILDING_SERVICE_URL: http://building-service:8005
      DAPR_HTTP_ENDPOINT: http://buildingSchedule-sidecar:3500
      DAPR_GRPC_ENDPOINT: http://buildingSchedule-sidecar:50001
    volumes: ["./metrics/buildingSchedule:/metrics"]
    depends_on: [building-service, buildingSchedule-sidecar]
  # --- roomSchedule ---
